[project]
name = "factcheck"
version = "0.1.0"
description = "Bilingual (Arabic + English) research and fact-checker: multi-agent, cited, benchmarked"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic[bedrock]>=2.6.0",
    "google-genai>=3.0",
    "httpx>=0.28",
    "langgraph>=1.0",
    "numpy>=2.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "rich>=13",
]

[project.optional-dependencies]
local-embed = ["fastembed>=0.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcore", "factcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
